      operationId: putApiV1OrgsByOrgProjectsByProjectSegmentsBySegment
      x-operation-id-source: derived
    delete:
      tags:
      - User Segments
      summary: Deletes a user segment
      description: Requires at least Member.
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: segment
        in: path
        required: true
        schema:
