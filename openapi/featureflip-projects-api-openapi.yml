openapi: 3.2.0
info:
  title: Management Projects API
  description: 'Programmatic access to Featureflip — projects, environments, feature flags, variations, targeting, segments, and SDK keys. Authenticate with a Personal Access Token or Service Token via the Authorization: Bearer header.'
  version: v1
servers:
- url: https://api.featureflip.io
  description: Production
security:
- Bearer: []
tags:
- name: Projects
  description: 'Projects within a resolved organization. Every route here carries `{org}`, so

    ResolveTenantFilter has already resolved + access-checked

    it before any action runs — dispatched commands/queries always use

    ResolvedOrgId, never the raw route string.

    `{project}` (get/update/delete) is resolved key-or-guid, scoped to the resolved org, via

    ResolveProjectIdAsync — same addressing pattern as

    OrganizationsController uses for `{org}`. Writes (create/update/delete)

    require at least Member

    (RequireRole); a Viewer attempting one gets a 403

    `forbidden` envelope.'
