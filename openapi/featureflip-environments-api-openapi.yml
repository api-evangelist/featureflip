components:
  schemas:
    PublicApiErrorEnvelope:
      required:
      - error
      - message
      - docs_url
      type: object
      properties:
        error:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        docs_url:
          type:
          - string
          - 'null'
        fields:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
        retry_after:
          type:
          - integer
          - 'null'
          format: int32
        did_you_mean:
          type:
          - array
          - 'null'
          items:
            type: string
        next_actions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NextAction'
        connection_id:
          type:
          - string
          - 'null'
          format: uuid
        plan_limit:
          $ref: '#/components/schemas/PublicPlanLimit'
      additionalProperties: false
      description: 'The frozen public-API error contract. `error` codes are stable snake_case strings. Wire keys

        are frozen snake_case too (`error`, `message`, `docs_url`, `fields`,

        `retry_after`) — the global camelCase naming policy would otherwise emit

        `docsUrl`/`retryAfter`, breaking the published spec. !:JsonPropertyName

        always wins over the policy, so these are pinned explicitly rather than relying on the

        property names already being lowercase for the single-word ones.

        `did_you_mean`, `next_actions` and `connection_id` are ADDITIVE optional keys

        (null → omitted via the global `DefaultIgnoreCondition = WhenWritingNull`), so

        pre-existing error bodies are byte-for-byte unchanged when they''re absent.


        `connection_id` is present only on the `sso_required` error: the organization

        requires single sign-on, and this credential didn''t come through its identity provider.

        `connection_id` identifies which SSO connection to sign in with.

        `plan_limit` is present only on the `plan_limit_reached` error: which plan cap the

        request would have exceeded, so a client can branch on it without parsing `message`.'
      example:
        error: not_found
        message: Flag 'new-checkout-flw' was not found in project 'checkout'.
        docs_url: https://featureflip.io/docs/management-api/errors/not_found
        did_you_mean:
        - new-checkout-flow
        next_actions:
        - method: GET
          path: /api/v1/orgs/acme/projects/checkout/flags
    PublicCreateEnvironmentRequest:
      required:
      - key
      - name
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        sortOrder:
          type: integer
          format: int32
      additionalProperties: false
      description: 'Request body for `POST /api/v1/orgs/{org}/projects/{project}/environments`. Named

        distinctly from the dashboard''s own `CreateEnvironmentRequest`

        — both controllers share one Swagger document (see `Program.cs`''s `AddSwaggerGen``DocInclusionPredicate` override), and Swashbuckle''s default schemaId is the bare type

        name, so an identical name in either namespace throws a schemaId collision at

        `--export-openapi` time.'
      example:
        key: production
        name: Production
        color: '#16A34A'
        sortOrder: 2
    PublicEnvironmentResponsePagedResult:
      required:
      - items
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PublicEnvironmentResponse'
        next_cursor:
          type:
          - string
          - 'null'
        _actions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ActionCapability'
          description: 'Capability hints: which operations the authenticated caller may perform on this resource, each with allowed + optional reason. Computed from the caller''s role and the resource''s state. Injected at runtime; safe to ignore. Present only on top-level resource responses — nested occurrences (e.g. a rule inside a targeting-config response) do not carry it.'
      additionalProperties: false
      description: 'A page of results plus an opaque cursor for the next page, or null when this is the last

        page. Wire keys are frozen: `items` (already lowercase under the camelCase policy) and

        `next_cursor` (pinned explicitly — the policy alone would emit `nextCursor`).'
    PublicPlanLimit:
      required:
      - resource
      - plan
      - max
      type: object
      properties:
        resource:
          type:
          - string
          - 'null'
        plan:
          type:
          - string
          - 'null'
        max:
          type: integer
          format: int32
      additionalProperties: false
      description: 'The cap behind a `plan_limit_reached` error. `resource` is the capped collection

        (`projects`, `environments`, `flags`, `webhooks`, `members`);

        `plan` is the plan''s wire name, as `GET /api/v1/orgs/{org}` returns it; `max` is

        the cap. The environment and flag caps are per project.'
    PublicUpdateEnvironmentRequest:
      required:
      - name
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        sortOrder:
          type: integer
          format: int32
      additionalProperties: false
      description: 'Request body for `PUT /api/v1/orgs/{org}/projects/{project}/environments/{env}`. See

        PublicCreateEnvironmentRequest for why this is named distinctly from the

        dashboard''s `UpdateEnvironmentRequest`.'
    PublicEnvironmentResponse:
      required:
      - id
      - key
      - name
      - sortOrder
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        sortOrder:
          type: integer
          format: int32
        _actions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ActionCapability'
          description: 'Capability hints: which operations the authenticated caller may perform on this resource, each with allowed + optional reason. Computed from the caller''s role and the resource''s state. Injected at runtime; safe to ignore. Present only on top-level resource responses — nested occurrences (e.g. a rule inside a targeting-config response) do not carry it.'
      additionalProperties: false
      description: 'Public representation of an environment, returned by

        `GET /api/v1/orgs/{org}/projects/{project}/environments` (list),

        `GET .../environments/{env}` (detail), and the body of a successful create/update. Drops

