components:
  schemas:
    PublicConditionGroupRequest:
      required:
      - operator
      - conditions
      type: object
      properties:
        operator:
          enum:
          - And
          - Or
          type:
          - string
          - 'null'
          description: 'Allowed values: And, Or.'
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PublicConditionRequest'
      additionalProperties: false
      description: Request-side condition group, symmetric with PublicConditionGroupResponse.
    PublicUpdateVariationRequest:
      required:
      - name
      - value
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: 'Request body for

        `PUT /api/v1/orgs/{org}/projects/{project}/flags/{flag}/variations/{variationId}`. The

        variation''s key is immutable via this endpoint (mirrors

        `UpdateVariationCommand`, which

        carries no `Key`).'
    PublicUpdateFlagEnvConfigRequest:
      type: object
      properties:
        defaultVariationId:
          type: string
          format: uuid
        strategy:
          enum:
          - SingleVariation
          - PercentageRollout
          - TargetedRollout
          type:
          - string
          - 'null'
          description: 'Allowed values: SingleVariation, PercentageRollout, TargetedRollout.'
        prerequisites:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PublicPrerequisiteDto'
      additionalProperties: false
      description: 'Request body for `PUT .../flags/{flag}/environments/{env}`. Named distinctly from the

        dashboard''s own `UpdateFlagEnvironmentConfigurationRequest`

        — see PublicCreateEnvironmentRequest for the schemaId-collision rationale (both

        controllers share one Swagger document). Strategy is passed through verbatim to

        Strategy

        — the existing command validator name-allowlists it (SingleVariation/PercentageRollout/

        TargetedRollout or null), so an invalid value surfaces as the handler''s own 400, not a

        controller-level guard. A null Prerequisites leaves prerequisites untouched; a

        non-null list replaces them wholesale (mirrors UpdateFlagPrerequisitesCommand''s

        replace-all semantics).'
      example:
        defaultVariationId: 0197b6a0-6a1b-7d4f-8c2e-3a4b5c6d7e8f
        strategy: PercentageRollout
        prerequisites:
        - prerequisiteFlagKey: checkout-api-enabled
          expectedVariationKey: 'true'
    PublicPlanLimit:
      required:
      - resource
      - plan
      - max
      type: object
      properties:
        resource:
          type:
          - string
          - 'null'
        plan:
          type:
          - string
          - 'null'
        max:
          type: integer
          format: int32
      additionalProperties: false
      description: 'The cap behind a `plan_limit_reached` error. `resource` is the capped collection

        (`projects`, `environments`, `flags`, `webhooks`, `members`);

        `plan` is the plan''s wire name, as `GET /api/v1/orgs/{org}` returns it; `max` is

        the cap. The environment and flag caps are per project.'
    PublicConditionRequest:
      required:
      - attribute
      - operator
      - values
      type: object
      properties:
        attribute:
          type:
          - string
          - 'null'
        operator:
          enum:
          - Equals
          - NotEquals
          - Contains
          - NotContains
          - GreaterThan
          - LessThan
          - GreaterThanOrEqual
          - LessThanOrEqual
          - In
          - NotIn
          - MatchesRegex
          - StartsWith
          - EndsWith
          - Before
          - After
          - SemverEquals
          - SemverGreaterThan
          - SemverGreaterThanOrEqual
          - SemverLessThan
          - SemverLessThanOrEqual
          type:
          - string
          - 'null'
          description: 'Allowed values: Equals, NotEquals, Contains, NotContains, GreaterThan, LessThan, GreaterThanOrEqual, LessThanOrEqual, In, NotIn, MatchesRegex, StartsWith, EndsWith, Before, After, SemverEquals, SemverGreaterThan, SemverGreaterThanOrEqual, SemverLessThan, SemverLessThanOrEqual.'
        values:
          type:
          - array
          - 'null'
          items:
            type: string
        negate:
          type: boolean
      additionalProperties: false
      description: Request-side condition, symmetric with PublicConditionResponse.
    PublicConditionGroupResponse:
      required:
      - operator
      - conditions
      type: object
      properties:
        operator:
          enum:
          - And
          - Or
          type:
          - string
          - 'null'
          description: 'Allowed values: And, Or.'
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PublicConditionResponse'
      additionalProperties: false
      description: 'A condition group within a PublicTargetingRuleResponse. Maps 1:1 onto

        ConditionGroupDto. Operator is a bare wire string naming one of

        the `ConditionGroupOperator` members (`"And"`/`"Or"`) —

        groups are ANDed together at the rule level; within a group, its conditions combine using

        this operator.'
    NextAction:
      required:
      - method
      - path
      type: object
      properties:
        method:
          type:
          - string
          - 'null'
        path:
          type:
          - string
          - 'null'
      additionalProperties: false
    PublicReorderRulesRequest:
      required:
      - ruleIds
      type: object
      properties:
        ruleIds:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
      additionalProperties: false
      description: 'Request body for `PUT .../rules/reorder`. Must include every existing rule id exactly

        once — `ReorderTargetingRulesCommandHandler` rejects duplicate, omitted, or unknown rule

        ids with `BadRequestException`, surfaced as an HTTP 400 `bad_request` envelope

        carrying the handler''s message.'
    PublicPrerequisiteDto:
      required:
      - prerequisiteFlagKey
      - expectedVariationKey
      type: object
      properties:
        prerequisiteFlagKey:
          type:
          - string
          - 'null'
        expectedVariationKey:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: 'A single prerequisite entry on a flag''s per-environment config. Maps 1:1 onto

        PrerequisiteDto (read side) and PrerequisiteInput (write side).'
    PublicTargetingConfigResponse:
      required:
      - isEnabled
      - rules
      type: object
      properties:
        isEnabled:
          type: boolean
        rules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PublicTargetingRuleResponse'
        _actions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ActionCapability'
          description: 'Capability hints: which operations the authenticated caller may perform on this resource, each with allowed + optional reason. Computed from the caller''s role and the resource''s state. Injected at runtime; safe to ignore. Present only on top-level resource responses — nested occurrences (e.g. a rule inside a targeting-config response) do not carry it.'
      additionalProperties: false
      description: 'The full targeting configuration for a flag in a single environment, returned by

        `GET .../targeting`. Maps 1:1 onto TargetingConfigurationDto — including

        its IsEnabled field, which reflects the parent

        `FlagEnvironmentConfiguration.IsEnabled` (whether the flag is on in this environment at

        all), not anything specific to targeting itself.'
    PublicFlagOwner:
      required:
      - id
      - email
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: A flag's owner as returned on flag reads. Null means the flag is unowned.
    PublicCreateFeatureFlagRequest:
      required:
      - key
      - name
      - type
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        type:
          enum:
          - Boolean
          - String
          - Number
          - Json
          type:
          - string
          - 'null'
          description: 'Allowed values: Boolean, String, Number, Json.'
        description:
          type:
          - string
          - 'null'
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
        initialVariations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PublicCreateVariationDto'
        clientSideVisible:
          type: boolean
        expiresAtUtc:
          type:
          - string
          - 'null'
          format: date-time
        ownerEmail:
          type:
          - string
          - 'null'
        isPermanent:
          type: boolean
      additionalProperties: false
      description: 'Request body for `POST /api/v1/orgs/{org}/projects/{project}/flags`. Named distinctly

        from the dashboard''s own `CreateFeatureFlagRequest`

        — see PublicCreateEnvironmentRequest for the

        schemaId-collision rationale (both controllers share one Swagger document). Type

        is passed through verbatim to Type, which itself takes a

        bare string (Boolean/String/Number/Json) rather than the domain enum — invalid values surface

        as the handler''s own validation failure, not a controller-level 400. ExpiresAtUtc is

        optional and advisory; a bare date (`2026-12-01`) means the end of that day in UTC, and a full

        timestamp is stored exactly. It must be in the future and requires the flag-expiration feature

        (400 `EXPIRY_IN_PAST` / `FEATURE_NOT_ENABLED`). OwnerEmail optionally names

        the owner (an active member, matched case-insensitively; requires the flag-ownership feature —

        400 `OWNER_NOT_MEMBER` / `FEATURE_NOT_ENABLED`). Omitted, the owner is the caller when

        the caller is a member, so a service token creates an unowned flag. IsPermanent marks

        the flag permanent (a kill switch, ops toggle or entitlement that is meant to stay; never reported for

        cleanup). It requires the flag-permanence feature and can''t be combined with ExpiresAtUtc

        (400 `FEATURE_NOT_ENABLED` / `PERMANENT_FLAG_HAS_EXPIRY`).'
      example:
        key: new-checkout-flow
        name: New Checkout Flow
        type: Boolean
        description: Gates the redesigned checkout experience.
        tags:
        - checkout
        - q3-launch
        initialVariations:
        - key: 'true'
          name: Enabled
          value: 'true'
          description: Serve the new checkout.
        - key: 'false'
          name: Disabled
          value: 'false'
          description: Serve the legacy checkout.
        clientSideVisible: false
    PublicPutTargetingRequest:
      type: object
      properties:
        rules:
          type:
          - array
          - 'null'
