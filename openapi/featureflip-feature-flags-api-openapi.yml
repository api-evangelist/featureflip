  /api/v1/orgs/{org}/projects/{project}/flags/{flag}/expiry:
    put:
      tags:
      - Feature Flags
      summary: Sets the flag's advisory expiry date
      description: 'Evaluation never changes when it passes — the flag is

        reported stale so it can be cleaned up. Requires at least Member. `expiresAtUtc` takes a

        date (`2026-12-01`), which means the end of that day in UTC, the same as picking it in the

        dashboard, or a full ISO-8601 timestamp, which is stored exactly. It must be in the future

        (400 `EXPIRY_IN_PAST`), so today''s date is accepted, and the flag-expiration feature must

        be enabled (400 `FEATURE_NOT_ENABLED`). A permanent flag can''t have a date

        (400 `PERMANENT_FLAG_HAS_EXPIRY`).'
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: flag
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicSetFlagExpiryRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PublicSetFlagExpiryRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PublicSetFlagExpiryRequest'
      responses:
        '204':
          description: No Content
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
