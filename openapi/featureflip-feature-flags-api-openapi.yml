openapi: 3.2.0
info:
  title: Management Feature Flags API
  description: 'Programmatic access to Featureflip — projects, environments, feature flags, variations, targeting, segments, and SDK keys. Authenticate with a Personal Access Token or Service Token via the Authorization: Bearer header.'
  version: v1
servers:
- url: https://api.featureflip.io
  description: Production
security:
- Bearer: []
tags:
- name: Feature Flags
  description: 'Feature flags within a resolved organization + project — mirrors

    EnvironmentsController''s resolve-then-dispatch shape one level deeper.

    `{project}` is resolved key-or-guid, scoped to the resolved org (with the service-token

    project allowlist forwarded), via ResolveProjectIdAsync

    for every action. `{flag}` (get/update/archive/restore/delete) is then resolved

    key-or-guid, scoped to the resolved project, via

    ResolveFlagIdAsync. Dispatched commands/queries always

    use the resolved GUIDs, never the raw route strings. Writes (create/update/archive/restore/

    delete) require at least Member

    (RequireRole); a Viewer attempting one gets a 403

    `forbidden` envelope. Flag deletion/variation-removal guards (`FLAG_HAS_DEPENDENTS`,

    etc.) surface as-is via the existing handlers'' custom

    ValidationException, which

    PublicApiExceptionFilterAttribute maps to a 400 `validation_failed`

    envelope automatically; the flag cap on create and restore throws its subclass

    PlanLimitExceededException, a 403

    `plan_limit_reached`. No action here special-cases either. Defers flag *runtime config*

    (env-config, toggle, targeting rules, prerequisites) and variations to their own controllers

    (phase 3b Task 3 / phase 3c).'
paths:
  /api/v1/orgs/{org}/projects/{project}/flags:
    post:
      tags:
      - Feature Flags
      summary: Creates a feature flag in the resolved project
      description: 'Requires at least Member.

        Type is passed through verbatim to

        Type (a bare string) — an invalid value surfaces as

        the handler''s own validation failure. Re-fetches via GetFeatureFlagQuery so

        the response reflects exactly what was persisted (e.g. server-assigned variation ids). A flag

        past the plan''s per-project cap on active flags is a 403 `plan_limit_reached`.'
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCreateFeatureFlagRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PublicCreateFeatureFlagRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PublicCreateFeatureFlagRequest'
      responses:
        '201':
          description: Created
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlagResponse'
        '400':
          description: The request is malformed, or it carries an If-Match header, which this endpoint can't evaluate. Send no If-Match, or `*`.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
        '403':
          description: Forbidden
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
        '404':
          description: Not Found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
        '401':
          description: Authentication is required, or the supplied API token is invalid or expired.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
        '429':
          description: Rate limit exceeded. Retry after the interval indicated by the Retry-After header.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying the request.
              schema:
                type: integer
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
      operationId: postApiV1OrgsByOrgProjectsByProjectFlags
      x-operation-id-source: derived
    get:
      tags:
      - Feature Flags
      summary: Lists feature flags in the resolved project, cursor-paginated
      description: 'Unlike

        List, ListFeatureFlagsQuery IS

        `Skip`/`Take`-based and returns a precise `Total`, so the next cursor is

        computed from the query result rather than an in-memory count. `type` is parsed

        leniently — an unrecognized value degrades to "no type filter" (matching

        Decode''s "garbage input degrades gracefully" precedent)

        rather than a 400, since it''s a non-critical list filter, not a mutation. `owner` filters

        by owner: an email (an active member, case-insensitive) or `none` for unowned flags.

        `permanent` filters to permanent (`true`) or temporary (`false`) flags.'
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: archived
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        schema:
          type: string
      - name: owner
        in: query
        schema:
          type: string
      - name: permanent
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlagListItemPagedResult'
        '404':
          description: Not Found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
        '401':
          description: Authentication is required, or the supplied API token is invalid or expired.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
        '429':
          description: Rate limit exceeded. Retry after the interval indicated by the Retry-After header.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying the request.
              schema:
                type: integer
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiErrorEnvelope'
      operationId: getApiV1OrgsByOrgProjectsByProjectFlags
      x-operation-id-source: derived
  /api/v1/orgs/{org}/projects/{project}/flags/removal-candidates:
    get:
      tags:
      - Feature Flags
      summary: Lists confidently-dead (or, with `staleness=stale`, stale-or-dead) flags the…
      description: 'Only flags the staleness engine marks at or

        above the requested tier with a settled value are returned: a decisive StuckRolledOut/StuckRolledBack

        reason, or ZeroTraffic/CreatedUnused when no environment saw traffic and every environment''s

        configuration serves one fixed variation (enabled, no rules, no prerequisites). Cross-env-divergent

        flags, flags without traffic whose configuration could serve more than one value, and archived

        flags are omitted (no confident code treatment). The ONLY public projection of staleness.

        Each item''s `blockedBy` names the live flags that still list it as a prerequisite; while

        it is non-empty the flag cannot be archived (`FLAG_HAS_DEPENDENTS`), so remove those first.'
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        schema:
          type: string
      - name: staleness
        in: query
        description: 'Minimum staleness tier to include: `dead` (default) or `stale` (includes Stale + Dead).

          Omitted or any unrecognized value falls back to `dead` — the safe default never widens

          silently.'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlagRemovalCandidatePagedResult'
        '404':
          description: Not Found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
