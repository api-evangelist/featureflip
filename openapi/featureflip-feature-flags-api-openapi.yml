    get:
      tags:
      - Feature Flags
      summary: Lists feature flags in the resolved project, cursor-paginated
      description: 'Unlike

        List, ListFeatureFlagsQuery IS

        `Skip`/`Take`-based and returns a precise `Total`, so the next cursor is

        computed from the query result rather than an in-memory count. `type` is parsed

        leniently — an unrecognized value degrades to "no type filter" (matching

        Decode''s "garbage input degrades gracefully" precedent)

        rather than a 400, since it''s a non-critical list filter, not a mutation.'
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: archived
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlagListItemPagedResult'
        '404':
          description: Not Found
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
