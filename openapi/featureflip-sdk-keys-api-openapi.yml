    get:
      tags:
      - SDK Keys
      summary: Lists SDK keys in the resolved environment, cursor-paginated
      description: 'Like

        List, ListSdkKeysQuery has no

        `Skip`/`Take` (an environment''s key count is small), so this fetches the full

