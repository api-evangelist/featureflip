name: Featureflip
description: >-
  Feature flag platform with automated dead-flag cleanup (via a GitHub Action), flat pricing, and API-first,
  agent-native surfaces. Exposes a Management REST API and a high-performance Evaluation API, both with public OpenAPI
  contracts, plus official SDKs for 13 languages, OpenFeature providers, a Terraform provider, and a local MCP server.
