name: Featureflip MCP Server
description: >-
  Local Model Context Protocol server that lets AI agents (Claude Code, Cursor,
  etc.) manage Featureflip flags by calling the Management API on the caller's
  behalf. It manages flag configuration; it does not evaluate flags at runtime.
deployment:
  mode: local-stdio
  endpoint: null
  install: "npx -y @featureflip/mcp"
  package: https://www.npmjs.com/package/@featureflip/mcp
  auth: api-key
  verified: searched
  note: >-
    Runs as a local process over stdio via npx; there is NO hosted/remote MCP
    endpoint an agent can POST to. Authenticates with the FEATUREFLIP_TOKEN
    environment variable (a Personal ffp_ or Service ffs_ bearer token).
